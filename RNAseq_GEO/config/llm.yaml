llm:
  enabled: false                       # ★ LLM 总开关：false = 关闭所有 AI 解读功能，不产生 API 费用
  provider: openai-compatible          # 固定，使用 openai 库的兼容模式
  api_base: https://api.deepseek.com/v1
  model: deepseek-chat
  temperature: 0.2
  timeout_sec: 120
  max_context_chars: 30000
  proxy: ''
cache:
  enabled: true
  cache_dir: result/{project}/00_data_intel
prompt:
  language: 中文
  max_sample_rows: 50
  include_qc: true
